plugins {
	// Minecraft 26.x ships unobfuscated, so Loom no longer remaps mods for it.
	// Older versions still need the remapping variant of the plugin.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

def mcVersion = project.minecraft_version
def isUnobfuscated = stonecutter.eval(mcVersion, ">=26")
def javaVersion = JavaVersion.toVersion(project.java_version)

apply plugin: isUnobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name + "-" + mcVersion
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${mcVersion}"

	if (isUnobfuscated) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	}
}

// The access widener has to be written in the namespace Loom compiles against.
// For 26.x that is Mojang's own names ("official"); before that it is "named".
def accessWidenerDir = rootProject.file(isUnobfuscated
		? "src/main/accesswidener/official"
		: "src/main/accesswidener/named")

loom {
	accessWidenerPath = new File(accessWidenerDir, "tmb.accesswidener")
}

// Ship the matching widener in the jar, where fabric.mod.json expects to find it.
sourceSets.main.resources.srcDir accessWidenerDir

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion
	inputs.property "minecraft_version", mcVersion
	inputs.property "java_version", project.java_version

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_version": mcVersion,
				"java_version": project.java_version
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "waytoomanybinds"
	versionNumber = project.mod_version + "-" + mcVersion
	versionType = "release"
	uploadFile = isUnobfuscated ? tasks.named("jar") : tasks.named("remapJar")
	gameVersions = [mcVersion]
	loaders = ["fabric", "quilt"]
	dependencies {
		required.project "fabric-api"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(project.java_version)
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

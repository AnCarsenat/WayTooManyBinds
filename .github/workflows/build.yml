# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Every Minecraft version Stonecutter targets. Keep in sync with settings.gradle.
        minecraft: ["1.21.11", "26.2"]
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          # 26.x compiles against Java 25; older targets still build fine on it.
          java-version: 25
          distribution: 'temurin'
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build ${{ matrix.minecraft }}
        run: ./gradlew ":${{ matrix.minecraft }}:build"
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wtmb-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/
